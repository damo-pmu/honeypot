name: Deploy to OCI

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          port: ${{ secrets.OCI_PORT }}
          
          script: |
            cd /home/ubuntu/test-honeypot
            git pull origin master
            
            # Create .env from template with secrets
            cat > .env << EOF
            # Auto-generated by GitHub Actions
            DASHBOARD_PASSWORD=${{ secrets.DASHBOARD_PASS }}
            API_KEY_OPENROUTER=${{ secrets.API_KEY_OPENROUTER }}
            PG_PASS=${{ secrets.PG_PASS }}
            GRAFANA_PASSWORD=${{ secrets.GRAFANA_PASS }}
            EOF
            
            docker compose pull || true
            docker compose up -d
            
            echo "✅ Deployment complete"