name: Deploy to OCI

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup .env with secrets
        run: |
          cp .env.example .env.deploy
          # Inject secrets from GitHub Actions
          sed -i "s/API_KEY_OPENROUTER=/API_KEY_OPENROUTER=${{ secrets.API_KEY_OPENROUTER }}/g" .env.deploy
          sed -i "s/PG_PASS=/PG_PASS=${{ secrets.PG_PASS }}/g" .env.deploy
          sed -i "s/GRAFANA_PASS=/GRAFANA_PASS=${{ secrets.GRAFANA_PASS }}/g" .env.deploy
          sed -i "s/DASHBOARD_PASS=/DASHBOARD_PASS=${{ secrets.DASHBOARD_PASS }}/g" .env.deploy
          
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Build and push Docker images
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: honeypot_api:latest,honeypot_cowrie:latest
          
      - name: Deploy instructions
        run: |
          echo "🚀 Ready for OCI deployment"
          echo ""
          echo "Copy .env.deploy to target machine and run:"
          echo "  scp .env.deploy user@honeypot.hiddenlabs.cc:/home/ubuntu/test-honeypot/.env"
          echo "  ssh user@honeypot.hiddenlabs.cc 'cd /home/ubuntu/test-honeypot && docker compose up -d'"