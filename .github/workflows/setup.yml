name: Setup Project

on:
  workflow_dispatch:  # Manual trigger
  repository_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Setup environment with secrets
        env:
          GITHUB_API_KEY_OPENROUTER: ${{ secrets.API_KEY_OPENROUTER }}
        run: |
          # Create .env with secrets
          cp .env.example .env
          if [ -n "$GITHUB_API_KEY_OPENROUTER" ]; then
            echo "OPENROUTER_API_KEY=$GITHUB_API_KEY_OPENROUTER" >> .env
            echo "LLM_PROVIDER=openrouter" >> .env
            echo "Using OpenRouter API key from secrets ✓"
          else
            echo "Warning: No OpenRouter secret set"
          fi
          
          # Sanitized output
          cat .env | sed 's/OPENROUTER_API_KEY=.*/OPENROUTER_API_KEY=***REDACTED***/'