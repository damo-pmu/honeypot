services:
  # Core API
  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    env_file: .env
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"  # localhost only - Apache reverse proxy
    depends_on:
      - postgres
      - redis
    environment:
      # Environment variables passed from .env
      - DASHBOARD_PASS=${DASHBOARD_PASS:-demo}
      - OPENROUTER_API_KEY=${API_KEY_OPENROUTER:-demo}
      # Constructed from .env values
      - DATABASE_URL=postgresql://honeypot:${PG_PASS:-demo}@postgres:5432/honeypot
      - REDIS_URL=redis://redis:6379
    volumes:
      - api_logs:/app/logs
      - api_data:/app/data
      - ./src/static:/app/static:ro
      - ./src/templates:/app/src/templates:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Database
  postgres:
    image: postgres:15-alpine
    env_file: .env
    environment:
      POSTGRES_DB: honeypot
      POSTGRES_USER: honeypot
      POSTGRES_PASSWORD: ${PG_PASS:-demo}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d

  # Cache & Queue
  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
      - redis_logs:/var/log/redis

  rabbitmq:
    image: rabbitmq:3-management-alpine
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - rabbitmq_logs:/var/log/rabbitmq

  # SSH/Telnet Honeypot (Cowrie)
  cowrie:
    build:
      context: ./docker/cowrie
      dockerfile: Dockerfile
    env_file: .env
    ports:
      - "${SSH_PORT:-22}:2222"  # SSH (honeypot on standard port 22, host sshd on 22222)
      - "${TELNET_PORT:-23}:23"    # Telnet
    volumes:
      - cowrie_logs:/cowrie/var/log/cowrie  # JSON logs (cowrie adds its own subdir)
      - cowrie_data:/cowrie/var/lib/cowrie  # SSH keys, data
    environment:
      - HONEYPOT_API_URL=http://api:8000/events

  # Worker: Cowrie events → API
  worker:
    build:
      context: .
      dockerfile: docker/worker/Dockerfile
    depends_on:
      - cowrie
      - api
    volumes:
      - cowrie_logs:/cowrie/var/log/cowrie:ro  # MUST match cowrie volume mount
      - worker_logs:/app/logs
    environment:
      - COWRIE_LOG=/cowrie/var/log/cowrie/cowrie.json  # MUST match cowrie volume mount
      - API_URL=http://api:8000
      - AUDIT_LOG_PATH=/app/logs/audit.log

  # Prom/Grafana (minimal)
  prometheus:
    image: prom/prometheus
    env_file: .env
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"  # localhost only - no public scrape
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:11.0.0
    env_file: .env
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"  # localhost only - Apache reverse proxy
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASS:-demo}
      - GF_PATHS_DATA=/var/lib/grafana
      - GF_PROVISIONING_ENABLED=true
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=/grafana
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    # Dashboard JSON files mounted for setup.sh API import (Grafana 11 provisioning disabled)
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/datasource.yaml:/etc/grafana/provisioning/datasources/datasource.yaml:ro
    #   - ./grafana/dashboard.yaml:/etc/grafana/provisioning/dashboards/dashboard.yaml:ro
    #   - ./grafana/dashboard-monitoring.json:/etc/grafana/provisioning/dashboards/monitoring.json:ro
    #   - ./grafana/dashboard-investigation.json:/etc/grafana/provisioning/dashboards/investigation.json:ro

volumes:
  postgres_data:
  postgres_logs:
  redis_data:
  redis_logs:
  rabbitmq_data:
  rabbitmq_logs:
  cowrie_logs:
  cowrie_data:
  worker_logs:
  api_logs:
  api_data:
  prometheus_data:
  grafana_data: