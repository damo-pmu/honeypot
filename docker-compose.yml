version: '3.8'

services:
  # Core API
  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    environment:
      - DATABASE_URL=postgresql://honeypot:secret@postgres:5432/honeypot
      - REDIS_URL=redis://redis:6379

  # Database
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: honeypot
      POSTGRES_USER: honeypot
      POSTGRES_PASSWORD: secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/migrations
    ports:
      - "5432:5432"

  # Cache & Queue
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"

  # SSH/Telnet Honeypot (Cowrie)
  cowrie:
    build:
      context: ./docker/cowrie
      dockerfile: Dockerfile
    ports:
      - "2222:2222"  # SSH
      - "23:23"      # Telnet
    volumes:
      - cowrie_logs:/cowrie/var/log
    environment:
      - HONEYPOT_API_URL=http://api:8000/events

  # Worker: Cowrie events → API
  worker:
    build:
      context: .
      dockerfile: docker/worker/Dockerfile
    depends_on:
      - cowrie
      - api
    volumes:
      - cowrie_logs:/cowrie/var/log:ro

  # Prom/Grafana (minimal)
  prometheus:
    image: prom/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana-enterprise
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin

volumes:
  postgres_data:
  cowrie_logs: