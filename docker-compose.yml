services:
  # Core API
  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    env_file: .env
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      - postgres
      - redis
    environment:
      - DASHBOARD_PASS=${DASHBOARD_PASS:-demo}
      - HONEYPOT_HOSTNAME=${HONEYPOT_HOSTNAME:-localhost}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5000,http://localhost:9090}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - LOCAL_LLM_MODEL=${LOCAL_LLM_MODEL:-}
      - DATABASE_URL=postgresql://honeypot:${PG_PASS:-demo}@${DB_HOST:-postgres}:${DB_PORT:-5432}/${DB_NAME:-honeypot}
      - REDIS_URL=redis://${REDIS_HOST:-redis}:${REDIS_PORT:-6379}
    volumes:
      - api_logs:/app/logs
      - api_data:/app/data
      - ./src/static:/app/static:ro
      - ./src/templates:/app/templates:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Database
  postgres:
    image: postgres:15-alpine
    env_file: .env
    environment:
      POSTGRES_DB: honeypot
      POSTGRES_USER: honeypot
      POSTGRES_PASSWORD: ${PG_PASS:-demo}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d

  # Cache & Queue
  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
      - redis_logs:/var/log/redis

  rabbitmq:
    image: rabbitmq:3-management-alpine
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - rabbitmq_logs:/var/log/rabbitmq

  # SSH/Telnet Honeypot (Cowrie)
  cowrie:
    build:
      context: ./docker/cowrie
      dockerfile: Dockerfile
    env_file: .env
    ports:
      - "${SSH_PORT:-22}:2222"
      - "${TELNET_PORT:-23}:23"
    volumes:
      - cowrie_logs:/cowrie/var/log/cowrie
      - cowrie_data:/cowrie/var/lib/cowrie
    environment:
      - HONEYPOT_API_URL=http://${API_HOST:-api}:${API_PORT:-8000}/events

  # Worker: Cowrie events → API
  worker:
    build:
      context: .
      dockerfile: docker/worker/Dockerfile
    depends_on:
      - cowrie
      - api
    volumes:
      - cowrie_logs:/cowrie/var/log/cowrie:ro
      - worker_logs:/app/logs
    environment:
      - COWRIE_LOG=/cowrie/var/log/cowrie/cowrie.json
      - API_URL=http://${API_HOST:-api}:${API_PORT:-8000}
      - AUDIT_LOG_PATH=/app/logs/audit.log

  # Maintenance service (retention cleanup, healthcheck filtering)
  maintenance:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    depends_on:
      - postgres
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://honeypot:${PG_PASS:-demo}@${DB_HOST:-postgres}:${DB_PORT:-5432}/${DB_NAME:-honeypot}
      - REDIS_URL=redis://${REDIS_HOST:-redis}:${REDIS_PORT:-6379}
      - RETENTION_INTERVAL=${RETENTION_INTERVAL:-86400}
      - HEALTHCHECK_INTERVAL=${HEALTHCHECK_INTERVAL:-3600}
    volumes:
      - api_logs:/app/logs
    entrypoint: ["python"]
    command: scripts/maintenance_scheduler.py
    restart: unless-stopped

  # Prom/Grafana (minimal)
  prometheus:
    image: prom/prometheus
    env_file: .env
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:11.0.0
    env_file: .env
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASS:-demo}
      - GF_PATHS_DATA=/var/lib/grafana
      - GF_PROVISIONING_ENABLED=true
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=/grafana
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/datasource.yaml:/etc/grafana/provisioning/datasources/datasource.yaml:ro

volumes:
  postgres_data:
  postgres_logs:
  redis_data:
  redis_logs:
  rabbitmq_data:
  rabbitmq_logs:
  cowrie_logs:
  cowrie_data:
  worker_logs:
  api_logs:
  api_data:
  prometheus_data:
  grafana_data: