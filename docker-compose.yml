version: '3.8'

services:
  # Core API
  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    environment:
      - DATABASE_URL=postgresql://honeypot:secret@postgres:5432/honeypot
      - REDIS_URL=redis://redis:6379
      - DASHBOARD_PASSWORD=${DASHBOARD_PASSWORD}
      - AUDIT_LOG_PATH=/app/logs/audit.log
    volumes:
      - api_logs:/app/logs
      - api_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Database
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: honeypot
      POSTGRES_USER: honeypot
      POSTGRES_PASSWORD: secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - postgres_logs:/var/lib/postgresql/data/log
      - ./migrations:/migrations
    ports:
      - "5432:5432"

  # Cache & Queue
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - redis_logs:/var/log/redis

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - rabbitmq_logs:/var/log/rabbitmq

  # SSH/Telnet Honeypot (Cowrie)
  cowrie:
    build:
      context: ./docker/cowrie
      dockerfile: Dockerfile
    ports:
      - "2222:2222"  # SSH
      - "23:23"      # Telnet
    volumes:
      - cowrie_logs:/cowrie/var/log
      - cowrie_data:/cowrie/var/lib
    environment:
      - HONEYPOT_API_URL=http://api:8000/events

  # Worker: Cowrie events → API
  worker:
    build:
      context: .
      dockerfile: docker/worker/Dockerfile
    depends_on:
      - cowrie
      - api
    volumes:
      - cowrie_logs:/cowrie/var/log:ro
      - worker_logs:/app/logs
    environment:
      - AUDIT_LOG_PATH=/app/logs/audit.log

  # Prom/Grafana (minimal)
  prometheus:
    image: prom/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana-enterprise
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_PATHS_DATA=/var/lib/grafana
    volumes:
      - grafana_data:/var/lib/grafana

volumes:
  postgres_data:
  postgres_logs:
  redis_data:
  redis_logs:
  rabbitmq_data:
  rabbitmq_logs:
  cowrie_logs:
  cowrie_data:
  worker_logs:
  api_logs:
  api_data:
  prometheus_data:
  grafana_data: