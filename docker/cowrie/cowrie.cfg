[honeypot]
# SSH - mapped to host port via SSH_PORT env var
ssh_port = 2222
# Telnet - mapped to host port via TELNET_PORT env var
telnet_port = 23

[output_jsonlog]
# Enable JSON logging - MUST match Docker volume path
enabled = true
logfile = /cowrie/var/log/cowrie.json

[output_telnet]
enabled = true

[ssh]
# Authentication settings
auth_none = false
auth_password = true
allow_agent_forwarding = false