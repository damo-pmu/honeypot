[honeypot]
# Cowrie configuration - safe defaults for testing
hostname = localhost.localdomain
sensor_name = damo-honeypot

# SSH/Telnet settings
ssh_port = 2222
telnet_port = 23

# Logging
log_path = /cowrie/var/log
log_file = cowrie.json

# JSON output for API integration
output = json

# Authentication (always fail for honeypot)
auth_none = false
auth_password = false

# No actual command execution
exec_enabled = false