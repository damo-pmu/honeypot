# Dashboard HTTPS Configuration
# Copy to /etc/apache2/sites-available/dashboard.hiddenlabs.cc-ssl.conf
# Run: a2ensite + systemctl reload apache2

<VirtualHost *:443>
    ServerName dashboard.hiddenlabs.cc
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/dashboard.hiddenlabs.cc/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/dashboard.hiddenlabs.cc/privkey.pem
    
    ProxyPreserveHost On
    ProxyRequests Off
    
    # WebSocket/SSE support for live dashboard updates
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/?(.*) "ws://localhost:8000/$1" [P,L]
    
    ProxyTimeout 300
    ProxyBadHeader Ignore
    
    # Dashboard routes - SSE stream prioritized
    ProxyPass /dashboard/stream http://localhost:8000/dashboard/stream connectiontimeout=5 retry=0
    ProxyPassReverse /dashboard/stream http://localhost:8000/dashboard/stream
    
    ProxyPass /dashboard/ http://localhost:8000/dashboard/
    ProxyPassReverse /dashboard/ http://localhost:8000/dashboard/
    
    ProxyPass / http://localhost:8000/dashboard/
    ProxyPassReverse / http://localhost:8000/dashboard/
    
    # Security headers
    Header always set X-Content-Type-Options nosniff
    Header always set X-Frame-Options DENY
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    
    ErrorLog /var/log/apache2/honeypot-dashboard-ssl.error.log
    CustomLog /var/log/apache2/honeypot-dashboard-ssl.access.log combined
</VirtualHost>

# HTTP to HTTPS redirect
<VirtualHost *:80>
    ServerName dashboard.hiddenlabs.cc
    Redirect permanent / https://dashboard.hiddenlabs.cc/
</VirtualHost>