{% extends 'base.html' %}

{% block title %}Connexion Honeypot SOC{% endblock %}

{% block content %}
<div class="login-shell">
    <section class="login-card">
        <h1>Honeypot SOC</h1>
        <form method="POST" action="/dashboard/login">
            <label for="password">Mot de passe</label>
            <input id="password" name="password" type="password" placeholder="Entrer le mot de passe" required autofocus />
            <button type="submit">Se connecter</button>
        </form>
        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}
    </section>
</div>
{% endblock %}
