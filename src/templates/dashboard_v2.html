<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Threat Intel Platform - SOC Dashboard</title>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
</head>
<body class="bg-gray-900 text-gray-100" x-data="dashboardStore()" x-init="init()">
    <!-- Header -->
    <header class="bg-gray-800 border-b border-gray-700 p-4">
        <div class="flex justify-between items-center">
            <h1 class="text-2xl font-bold text-red-500">SOC Threat Intel Platform</h1>
            <div class="flex items-center space-x-4">
                <span class="text-sm" :class="connected ? 'text-green-500' : 'text-gray-500'" x-text="connected ? 'Live' : 'Offline'"></span>
                <a href="/dashboard/logout" class="text-gray-400 hover:text-white">Logout</a>
            </div>
        </div>
    </header>

    <div class="flex h-screen">
        <!-- Sidebar -->
        <nav class="w-64 bg-gray-800 border-r border-gray-700 p-4">
            <ul class="space-y-2">
                <li><a href="#overview" class="block py-2 px-4 rounded hover:bg-gray-700" @click="activeView='overview'">📊 Overview</a></li>
                <li><a href="#alerts" class="block py-2 px-4 rounded hover:bg-gray-700" @click="activeView='alerts'">🚨 Alerts</a></li>
                <li><a href="#live" class="block py-2 px-4 rounded hover:bg-gray-700" @click="activeView='live'">🔴 Live Feed</a></li>
                <li><a href="#map" class="block py-2 px-4 rounded hover:bg-gray-700" @click="activeView='map'">🌍 World Map</a></li>
                <li><a href="#campaigns" class="block py-2 px-4 rounded hover:bg-gray-700" @click="activeView='campaigns'">🎯 Campaigns</a></li>
                <li><a href="#iocs" class="block py-2 px-4 rounded hover:bg-gray-700" @click="activeView='iocs'">🔍 IOC Explorer</a></li>
                <li><a href="#payloads" class="block py-2 px-4 rounded hover:bg-gray-700" @click="activeView='payloads'">📁 Payloads</a></li>
                <li><a href="#investigation" class="block py-2 px-4 rounded hover:bg-gray-700" @click="activeView='investigation'">🕵️ Investigation</a></li>
            </ul>
        </nav>

        <!-- Main Content -->
        <main class="flex-1 p-6 overflow-y-auto">
            <!-- Overview/KPI View -->
            <div x-show="activeView==='overview'" class="space-y-6">
                <h2 class="text-xl font-semibold mb-4">Security Overview</h2>
                
                <div class="grid grid-cols-4 gap-4">
                    <div class="bg-gray-800 p-4 rounded">
                        <div class="text-3xl font-bold text-red-500" x-text="stats.total_attacks || 0"></div>
                        <div class="text-sm text-gray-400">Total Attacks</div>
                    </div>
                    <div class="bg-gray-800 p-4 rounded">
                        <div class="text-3xl font-bold text-orange-500" x-text="stats.unique_attackers || 0"></div>
                        <div class="text-sm text-gray-400">Unique Attackers</div>
                    </div>
                    <div class="bg-gray-800 p-4 rounded">
                        <div class="text-3xl font-bold text-yellow-500" x-text="stats.critical_risk || 0"></div>
                        <div class="text-sm text-gray-400">Critical Risk</div>
                    </div>
                    <div class="bg-gray-800 p-4 rounded">
                        <div class="text-3xl font-bold text-blue-500" x-text="stats.active_sessions || 0"></div>
                        <div class="text-sm text-gray-400">Active Sessions</div>
                    </div>
                </div>

                <!-- Attack Types Chart -->
                <div class="bg-gray-800 p-4 rounded">
                    <h3 class="font-semibold mb-2">Attack Distribution</h3>
                    <div class="space-y-2">
                        <template x-for="[type, count] in Object.entries(stats.attack_types || {})">
                            <div class="flex items-center">
                                <span class="w-32 text-sm" x-text="type"></span>
                                <div class="flex-1 bg-gray-700 rounded h-4">
                                    <div class="bg-red-500 h-4 rounded" :style="`width: ${Math.min(count * 2, 100)}%`"></div>
                                </div>
                                <span class="ml-2 text-xs" x-text="count"></span>
                            </div>
                        </template>
                    </div>
                </div>
            </div>

            <!-- Investigation View -->
            <div x-show="activeView==='investigation'" class="space-y-4">
                <div class="flex space-x-4">
                    <input type="text" placeholder="Search session ID..." class="flex-1 bg-gray-800 p-2 rounded" x-model="searchSessionId" @keyup.enter="loadInvestigation()">
                    <button @click="loadInvestigation()" class="bg-blue-600 px-4 rounded">Load</button>
                </div>

                <div x-show="investigation.timeline?.length" class="space-y-4">
                    <h3 class="font-semibold">Timeline</h3>
                    <div class="bg-gray-800 p-4 rounded space-y-2">
                        <template x-for="event in investigation.timeline || []">
                            <div class="flex items-center space-x-3">
                                <span class="text-xs w-24" x-text="event.stage"></span>
                                <div class="w-2 h-2 bg-red-500 rounded-full"></div>
                                <span class="text-sm" x-text="event.description"></span>
                            </div>
                        </template>
                    </div>
                </div>

                <div x-show="investigation.replay?.length" class="space-y-4">
                    <h3 class="font-semibold">Replay</h3>
                    <div class="bg-gray-800 p-4 rounded max-h-96 overflow-y-auto">
                        <template x-for="item in investigation.replay || []">
                            <div class="font-mono text-xs border-b border-gray-700 py-1">
                                <span class="text-gray-500" x-text="item.timestamp"></span>
                                <span class="ml-2 text-green-400" x-text="item.action"></span>
                            </div>
                        </template>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        function dashboardStore() {
            return {
                connected: false,
                activeView: 'overview',
                searchSessionId: '',
                stats: {},
                events: [],
                investigation: {},

                init() {
                    this.loadStats();
                    this.loadLiveFeed();
                    this.setupSSE();
                    setInterval(() => this.loadStats(), 30000);
                },

                setupSSE() {
                    const evtSource = new EventSource('/dashboard/stream');
                    const self = this;

                    evtSource.onmessage = (e) => {
                        const data = JSON.parse(e.data);
                        if (data.type === 'attack_created') {
                            self.loadLiveFeed();
                            self.loadStats();
                        }
                    };

                    evtSource.onopen = () => this.connected = true;
                    evtSource.onerror = () => this.connected = false;
                },

                async loadStats() {
                    const resp = await fetch('/dashboard/api/stats');
                    this.stats = await resp.json();
                },

                async loadLiveFeed() {
                    const resp = await fetch('/dashboard/api/live-feed?limit=20');
                    const data = await resp.json();
                    this.events = data.items || [];
                },

                async loadInvestigation() {
                    if (!this.searchSessionId) return;
                    
                    const [timeline, replay] = await Promise.all([
                        fetch(`/dashboard/api/timeline/${this.searchSessionId}`).then(r => r.json()),
                        fetch(`/dashboard/api/replay/${this.searchSessionId}`).then(r => r.json())
                    ]);

                    this.investigation = { timeline, replay };
                }
            };
        }
    </script>
</body>
</html>
