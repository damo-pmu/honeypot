{# Login Page - SOC Theme #}
<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍯 Honeypot - Authentication</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        'soc-bg': '#0a0a0a',
                        'soc-card': '#111111',
                        'soc-border': '#333333',
                        'soc-accent': '#00ff88'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-soc-bg text-gray-200 flex items-center justify-center min-h-screen">
    <div class="bg-soc-card border border-soc-border rounded-lg p-8 w-full max-w-md">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-soc-accent mb-2">🍯 Honeypot SOC</h1>
            <p class="text-sm text-gray-500">Security Operations Center</p>
        </div>
        
        <form method="post" action="/dashboard/login" class="space-y-4">
            <div>
                <label for="password" class="block text-xs text-gray-500 mb-1">Access Key</label>
                <input type="password" 
                       name="password" 
                       id="password"
                       placeholder="Enter dashboard password"
                       required
                       class="w-full px-3 py-2 bg-soc-bg border border-soc-border rounded focus:outline-none focus:border-soc-accent font-mono">
            </div>
            
            <button type="submit" 
                    class="w-full py-2 bg-soc-accent text-black font-bold rounded hover:bg-opacity-80 transition">
                Access Dashboard
            </button>
        </form>
        
        {# Error message #}
        {% if error %}
        <p class="mt-4 text-center text-soc-danger text-sm">{{ error }}</p>
        {% endif %}
    </div>
</body>
</html>
